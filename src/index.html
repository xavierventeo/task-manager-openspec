<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>Task Manager</h1>
    </header>

    <main class="page-main">
      <section class="create-panel" aria-labelledby="create-heading">
        <h2 id="create-heading">New task</h2>
        <form id="task-form" novalidate>
          <div class="field">
            <label for="task-title">Title <span class="label-hint" aria-hidden="true">(required)</span></label>
            <input
              type="text"
              id="task-title"
              name="title"
              autocomplete="off"
              aria-required="true"
            />
            <p id="title-error" class="field-error" role="alert" hidden></p>
          </div>
          <div class="field">
            <label for="task-description">Description <span class="label-hint">(optional)</span></label>
            <textarea id="task-description" name="description" rows="3"></textarea>
          </div>
          <button type="submit" class="btn-primary">Create task</button>
        </form>
      </section>

      <section id="empty-state" class="empty-state" aria-live="polite">
        <p>No tasks yet. Create one above to see it on the board.</p>
      </section>

      <section class="board" aria-label="Tasks by status">
        <section class="column" aria-labelledby="heading-todo">
          <h2 id="heading-todo" class="column-heading">To Do</h2>
          <ul id="list-todo" class="task-list" data-status="todo"></ul>
        </section>
        <section class="column" aria-labelledby="heading-in-progress">
          <h2 id="heading-in-progress" class="column-heading">In Progress</h2>
          <ul id="list-in-progress" class="task-list" data-status="in-progress"></ul>
        </section>
        <section class="column" aria-labelledby="heading-done">
          <h2 id="heading-done" class="column-heading">Done</h2>
          <ul id="list-done" class="task-list" data-status="done"></ul>
        </section>
      </section>
    </main>

    <dialog id="task-edit-dialog" class="task-dialog" aria-labelledby="edit-dialog-heading">
      <form id="edit-task-form" novalidate>
        <h2 id="edit-dialog-heading">Edit task</h2>
        <div class="field">
          <label for="edit-task-title">Title <span class="label-hint" aria-hidden="true">(required)</span></label>
          <input
            type="text"
            id="edit-task-title"
            name="edit-title"
            autocomplete="off"
            aria-required="true"
          />
          <p id="edit-title-error" class="field-error" role="alert" hidden></p>
        </div>
        <div class="field">
          <label for="edit-task-description">Description <span class="label-hint">(optional)</span></label>
          <textarea id="edit-task-description" name="edit-description" rows="3"></textarea>
        </div>
        <div class="dialog-actions">
          <button type="button" id="edit-cancel" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </dialog>

    <script src="app.js" defer></script>
  </body>
</html>
